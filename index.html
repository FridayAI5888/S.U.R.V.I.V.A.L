<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURVIVAL — Veyra City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #05070a;
    --red: #e11d2e;
    --red-glow: #ff2a3c;
    --text: #e8e6e3;
    --text-muted: #9a9590;
    --glass: rgba(12, 14, 18, 0.72);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: 
      linear-gradient(180deg, rgba(5,7,10,0.55) 0%, rgba(5,7,10,0.85) 45%, rgba(5,7,10,0.95) 100%),
      url('title.png') center/cover no-repeat;
    filter: brightness(0.85) contrast(1.1);
  }

  .bg-layer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 70% 40%, rgba(225,29,46,0.12) 0%, transparent 55%);
    pointer-events: none;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    opacity: 0.4;
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .wrapper {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem 4rem;
  }

  .brand {
    text-align: center;
    margin-bottom: 1.5rem;
    animation: fadeUp 1.2s ease-out both;
  }

  .brand-sub {
    font-family: 'Orbitron', sans-serif;
    font-weight: 400;
    font-size: 0.75rem;
    letter-spacing: 0.55em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(3.2rem, 12vw, 6.5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #f5f2ef 0%, #c8c4bf 40%, #8a8580 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
  }

  .title .slash {
    color: var(--red);
    background: none;
    -webkit-background-clip: unset;
    background-clip: unset;
    text-shadow: 
      0 0 12px var(--red-glow),
      0 0 30px rgba(225,29,46,0.5),
      0 0 60px rgba(225,29,46,0.25);
    display: inline-block;
    transform: scaleY(1.15);
  }

  .tagline {
    margin-top: 1.1rem;
    font-size: 1.05rem;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    animation: fadeUp 1.4s ease-out 0.15s both;
  }

  .tagline span {
    color: var(--red);
    font-weight: 600;
  }

  .card {
    width: 100%;
    max-width: 480px;
    margin-top: 2.8rem;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 2.6rem 2.2rem;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: fadeUp 1.5s ease-out 0.25s both;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(225,29,46,0.5), transparent);
  }

  .file-icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 1.5rem;
    border-radius: 18px;
    background: linear-gradient(145deg, #1a1d24, #0d0f13);
    border: 1px solid rgba(225,29,46,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 40px rgba(225,29,46,0.25);
    position: relative;
  }

  .file-icon::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(225,29,46,0.15), transparent 60%);
    border-radius: 18px;
  }

  .file-icon svg {
    width: 42px;
    height: 42px;
    stroke: var(--red);
    fill: none;
    stroke-width: 1.6;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 0 8px rgba(225,29,46,0.6));
  }

  .file-name {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
    color: #f0eeeb;
  }

  .file-meta {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 1.9rem;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    background: linear-gradient(135deg, var(--red) 0%, #b01020 100%);
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 1rem 2.4rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 4px 20px rgba(225,29,46,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }

  .download-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 30px rgba(225,29,46,0.55), 0 0 40px rgba(225,29,46,0.3);
  }

  .download-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .download-btn svg {
    width: 18px;
    height: 18px;
    stroke: white;
    fill: none;
    stroke-width: 2;
  }

  .footer {
    margin-top: 3.5rem;
    text-align: center;
    animation: fadeUp 1.8s ease-out 0.4s both;
  }

  .footer p {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: rgba(154,149,144,0.6);
    text-transform: uppercase;
  }

  .footer .city {
    color: rgba(225,29,46,0.7);
    font-weight: 600;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .card { padding: 2rem 1.4rem; }
    .title { font-size: clamp(2.6rem, 14vw, 4rem); }
  }
</style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="overlay"></div>
  <div class="grain"></div>

  <div class="wrapper">
    <div class="brand">
      <div class="brand-sub">Veyra City</div>
      <h1 class="title">SURV<span class="slash">I</span>VAL</h1>
      <p class="tagline">Same city. New nightmares. <span>Survive.</span></p>
    </div>

    <div class="card">
      <div class="file-icon">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>

      <div class="file-name">SURVIVAL.exe</div>
      <div class="file-meta">Windows • Direct Download</div>

      <!-- CHANGE THIS LINK to your real .exe location -->
      <a href="SURVIVAL.exe" class="download-btn" download>
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download
      </a>
    </div>

    <div class="footer">
      <p>Enter the ruins of <span class="city">Veyra City</span></p>
    </div>
  </div>
</body>
</html>
